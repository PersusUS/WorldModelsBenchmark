benchmark:
  family: "dmcontrol"
  sequences:
    # Same task, perturbed physics — the mildest change the benchmark defines.
    # This pair used to be cheetah/run against itself with a `lateral_wind: true`
    # that no code read (F8), so the level measured forgetting between a task
    # and itself. The perturbation now matches the Gymnasium family's own
    # distance_min (gravity 9.81 -> 7.0) so the two families' minimum levels are
    # the same physical change and d_param is defined for both.
    distance_min:
      task_A:
        domain_name: "cheetah"
        task_name: "run"
        params:
          gravity: 9.81
      task_B:
        domain_name: "cheetah"
        task_name: "run"
        params:
          gravity: 7.0
    distance_med:
      task_A:
        domain_name: "cheetah"
        task_name: "run"
        params: {}
      task_B:
        domain_name: "walker"
        task_name: "run"
        params: {}
    # This level has been wrong twice, and the second attempt is the
    # instructive one.
    #
    # It shipped as cheetah/run -> reacher/easy, which cannot run at all:
    # reacher has 2 actuators against cheetah's 6 and one world model spans
    # both tasks, so its GRU has a single action width (F25).
    #
    # It was then set to walker/stand, on the reasoning that it changes body
    # and objective where distance_med changes only the body. That produced a
    # bit-identical copy of distance_med (F26): in dm_control the tasks of a
    # domain share physics and initial-state distribution and differ **only in
    # the reward function**, and this benchmark trains a reward-free model on
    # random-policy rollouts. The reward never enters, so walker/run and
    # walker/stand are the same environment as far as anything measured here is
    # concerned.
    #
    # So a dm_control level can only differ by domain or by physics. Only
    # cheetah and walker have 6 actuators, and the domain change is already
    # spent on distance_med, which leaves physics: this is distance_med's body
    # change plus the perturbation that Gymnasium's own distance_max applies
    # (gravity 4.0, mass x3, friction x0.5). Strictly more change than
    # distance_med, by construction rather than by argument -- and d_trans
    # checks it: distance_med measures 6.99 +- 3.00.
    distance_max:
      task_A:
        domain_name: "cheetah"
        task_name: "run"
        params: {}
      task_B:
        domain_name: "walker"
        task_name: "run"
        params:
          gravity: 4.0
          mass_scale: 3.0
          friction_scale: 0.5

# Training protocol. These values are what `experiments/run_full_benchmark.py`
# actually executes: it reads every one of them from here and hardcodes none.
# Every metrics.json records the block it was produced with, so Table 1 of the
# paper must be generated from the results, never written by hand.
protocol:
  n_collect: 20            # episodes collected per task, random policy
  n_train: 5000            # gradient updates per task; 5x the smoke budget,
                           # the knee of the task-A convergence curve (R11)
  batch_size: 8
  seq_len: 5
  learning_rate: 1.0e-3
  curve_points: 20         # reconstruction-loss samples kept per task
  n_eval_episodes: 10      # held-out task-A episodes, never trained on
  n_eval_transitions: 100  # transitions drawn from them to form D_i
  n_fisher_transitions: 50 # subset used for EWC's Fisher diagonal
  n_recon_frames: 200      # held-out frames for the pixel-space task-A check
  rd_horizon: 15
  rd_samples: 50
  ewc_lambda: 1000.0
  mc_dropout_T_train: 3    # overrides the model config during training only
  wmf_weights:             # P7 is still open; these are the paper's Eq. 6
    alpha: 0.4
    beta: 0.4
    gamma: 0.2
  seeds: [0, 1, 2, 3, 4]

model:
  latent_dim: 32
  hidden_dim: 512
  action_dim: 6
  beta_kl: 1.0
